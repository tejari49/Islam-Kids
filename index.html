<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IslamKids PWA</title>
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="IslamKids - Lerne Duas spielend leicht" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        const root = document.getElementById('root');

        root.innerHTML = `
          <main style="min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: linear-gradient(180deg, #ecfdf5 0%, #f9fafb 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1f2937; box-sizing: border-box;">
            <section style="max-width: 560px; width: 100%; background: #ffffff; border: 1px solid #d1fae5; border-radius: 24px; box-shadow: 0 20px 45px rgba(16, 185, 129, 0.12); padding: 24px;">
              <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #059669; letter-spacing: 0.04em; text-transform: uppercase;">IslamKids</p>
              <h1 style="margin: 0 0 12px; font-size: 28px; line-height: 1.2;">Diese App kann nicht direkt per Doppelklick geöffnet werden.</h1>
              <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.6;">Vite-Apps brauchen einen Webserver. Wenn du <code>index.html</code> direkt über <code>file://</code> öffnest, blockiert der Browser die Modul-Dateien und die Seite bleibt leer.</p>
              <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.6;">Starte die App stattdessen mit einem lokalen Server, zum Beispiel:</p>
              <pre style="margin: 0; padding: 16px; background: #111827; color: #f9fafb; border-radius: 16px; overflow: auto; font-size: 14px; line-height: 1.6;">npm install
npm run dev</pre>
              <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: #4b5563;">Für die gebaute Version (<code>dist/</code>) brauchst du ebenfalls einen Server, z. B. <code>npx serve dist</code>.</p>
            </section>
          </main>
        `;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
